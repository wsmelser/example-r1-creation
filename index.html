<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, height=282, initial-scale=1, user-scalable=no">
<title>Owl Facts</title>
<style>
  :root { --bg:#101014; --fg:#f4f1ea; --dim:#8b8b96; --accent:#ffb347; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 240px; height: 282px; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { position: relative; }
  #app {
    position: absolute; left: 50%; top: 50%;
    width: 240px; height: 282px;
    padding: 14px; display: flex; flex-direction: column;
    transform-origin: 50% 50%;
    transform: translate(-50%, -50%) rotate(0deg);
  }
  #app.landscape { padding: 10px 12px; }
  #app.landscape #body { font-size: 11px; line-height: 1.4; margin-top: 6px; }
  #app.landscape h1 { font-size: 14px; }
  #app.landscape #foot { margin-top: 4px; }

  button {
    font: inherit; color: inherit; background: none; border: 0;
    padding: 0; margin: 0; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    -webkit-tap-highlight-color: transparent;
  }

  #top { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em; flex: 1 1 auto; }
  #hint { font-size: 10px; color: var(--dim); margin-top: 2px; flex: 0 0 auto; }
  #body { flex: 1 1 auto; min-height: 0; margin-top: 10px; font-size: 12px; line-height: 1.45; overflow: hidden; }
  #body ul { padding-left: 14px; }
  #body li { margin-bottom: 6px; }
  #body img.shot {
    display: block; width: 100%; height: 100%;
    object-fit: contain; background: #000; border-radius: 8px;
  }
  .fade { transition: opacity 180ms ease-out, transform 180ms ease-out; }
  .hidden { opacity: 0; transform: translateY(6px); pointer-events: none; }

  #foot {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    margin-top: 6px;
  }
  #status {
    flex: 1 1 auto; min-width: 0; height: 12px; overflow: hidden;
    font-size: 10px; line-height: 12px; color: var(--dim);
  }
  .iconbtn {
    flex: 0 0 auto; width: 44px; height: 44px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
    border: 1px solid #2c2c36; border-radius: 10px;
    color: var(--fg); opacity: 1;
    transition: opacity 120ms ease-out;
  }
  .iconbtn .lbl {
    font-size: 8px; line-height: 1; letter-spacing: .04em;
    color: var(--dim); text-transform: uppercase;
  }
  .iconbtn:active { opacity: .55; }
  .iconbtn.off { opacity: .45; }

  #spinner {
    flex: 0 0 auto; width: 10px; height: 10px;
    border: 2px solid var(--dim); border-top-color: var(--accent); border-radius: 50%;
    opacity: 0; transition: opacity 150ms ease-out;
  }
  #spinner.on { opacity: 1; animation: spin 700ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hbtn {
    flex: 0 0 auto; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #2c2c36; border-radius: 10px;
    color: var(--fg); opacity: 1;
    transition: opacity 120ms ease-out;
  }
  .hbtn:active { opacity: .55; }

  #cam {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    z-index: 2;
    display: flex; flex-direction: column;
    background: #000;
    opacity: 0; pointer-events: none;
    transition: opacity 160ms ease-out;
  }
  #cam.on { opacity: 1; pointer-events: auto; }
  #camVideo {
    flex: 1 1 0; min-height: 0; width: 100%;
    object-fit: cover; background: #000; display: block;
  }
  #camBar {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px;
    padding: 6px 8px 8px;
  }
  #camStatus { font-size: 10px; line-height: 1.3; color: var(--dim); min-height: 12px; }
  #camBtns { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  #camSwitch, #camShot, #camClose {
    flex: 0 0 auto; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #2c2c36; border-radius: 10px;
    color: var(--fg); opacity: 1;
    transition: opacity 120ms ease-out;
  }
  #camSwitch:active, #camShot:active, #camClose:active { opacity: .55; }
  #camSwitch.front { color: var(--accent); }

  /* ---- diagnostics overlay ---- */
  #diag {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    z-index: 5;
    display: flex; flex-direction: column;
    padding: 6px 10px 6px;
    background: #0b0b0f;
    opacity: 0; pointer-events: none;
    transition: opacity 140ms ease-out;
  }
  #diag.on { opacity: 1; pointer-events: auto; }
  #diagTop { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; height: 44px; }
  #diagTitle {
    flex: 1 1 auto; font-size: 10px; font-weight: 600;
    letter-spacing: .14em; color: var(--accent);
  }
  #diagClose {
    flex: 0 0 auto; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #2c2c36; border-radius: 10px;
    color: var(--fg);
  }
  #diagClose:active { opacity: .55; }
  #diagList { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .drow {
    display: flex; align-items: baseline; gap: 6px;
    height: 14px; line-height: 14px;
  }
  .drow.sub { padding-left: 9px; }
  .dname {
    flex: 1 1 auto; min-width: 0;
    font-size: 9.5px; color: #c9c6bf;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .drow.sub .dname { color: #98959b; }
  .dval {
    flex: 0 0 auto;
    font-size: 9.5px; color: var(--fg);
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .dval.ok { color: #7ee08a; }
  .dval.no { color: #ff7a6b; }
  .dval.warn { color: var(--accent); }
  .derr {
    display: block;
    width: 100%;
    font-size: 8.5px; line-height: 11.5px; color: #ff9a8d;
    padding-left: 9px; max-height: 23px;
    overflow: hidden; word-break: break-word; white-space: normal;
  }
  #diagFoot { flex: 0 0 auto; font-size: 8.5px; line-height: 12px; color: var(--dim); }
  /* Landscape gives 240 px of height instead of 282, so the rows tighten up
     rather than the panel scrolling. */
  #app.landscape #diag { padding: 4px 10px 4px; }
  #app.landscape #diagTop { height: 40px; }
  #app.landscape .drow { height: 12px; line-height: 12px; }
  #app.landscape .dname, #app.landscape .dval { font-size: 9px; }
  #app.landscape .derr { font-size: 8px; line-height: 10.5px; max-height: 21px; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1>Owl Facts</h1>
    <div id="spinner"></div>
    <button id="diagBtn" class="hbtn" type="button" aria-label="Show diagnostics" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
        <path d="M3.5 12h3.2l2.1-5.4 3.1 11 2.4-7.2 1.6 3.6h4.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="camBtn" class="hbtn" type="button" aria-label="Open camera" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
        <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="12" cy="13" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    </button>
  </div>
  <div id="hint">Tap the side button for a fact</div>
  <div id="body" class="fade"><p>Ready.</p></div>
  <div id="foot">
    <div id="status"></div>
    <button id="recalBtn" class="iconbtn" type="button" aria-label="Set upright from the pose you are holding">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="lbl">upright</span>
    </button>
    <button id="tiltBtn" class="iconbtn" type="button" aria-label="Turn tilt off" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
        <rect x="8.5" y="3.5" width="7" height="17" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4 8.5a7.5 7.5 0 0 0 0 7M20 15.5a7.5 7.5 0 0 0 0-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="lbl">tilt</span>
    </button>
  </div>
  <div id="cam">
    <video id="camVideo" playsinline muted autoplay></video>
    <div id="camBar">
      <div id="camStatus">camera</div>
      <div id="camBtns">
        <button id="camSwitch" type="button" aria-label="Switch to front camera" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="M4.8 9.6a7.5 7.5 0 0 1 12.5-2.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M17.9 3.5v3.9h-3.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19.2 14.4a7.5 7.5 0 0 1-12.5 2.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M6.1 20.5v-3.9h3.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="camShot" type="button" aria-label="Take a photo">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="3.4" fill="currentColor"/>
          </svg>
        </button>
        <button id="camClose" type="button" aria-label="Close camera">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <div id="diag">
    <div id="diagTop">
      <span id="diagTitle">DIAGNOSTICS</span>
      <button id="diagClose" type="button" aria-label="Close diagnostics">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div id="diagList"></div>
    <div id="diagFoot">tap the list to re-check</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---- bridge detection -------------------------------------------------
  // Read live, never snapshotted. The r1 injects its bridge globals into the
  // WebView, and on this device they are not reliably present at the moment
  // this script first runs: a flag captured once at page load stays false for
  // the whole session even though the sensor is there. Every check below
  // therefore re-reads window each time it is asked.
  function safeGet(name) {
    try { return window[name]; } catch (e) { return undefined; }
  }
  function hasPlugin()  { return typeof safeGet("PluginMessageHandler") !== "undefined"; }
  function hasStorage() {
    try {
      var s = safeGet("creationStorage");
      return !!(s && s.plain);
    } catch (e) { return false; }
  }
  function hasClose()   { return typeof safeGet("closeWebView") !== "undefined"; }
  function hasVoice()   { return typeof safeGet("CreationVoiceHandler") !== "undefined"; }
  function accelObj() {
    try {
      var cs = safeGet("creationSensors");
      return (cs && cs.accelerometer) || null;
    } catch (e) { return null; }
  }
  function hasSensors() { return !!accelObj(); }

  function errText(e) {
    if (!e) return "unknown error";
    var n = "";
    var m = "";
    try { n = e.name || ""; } catch (x) { n = ""; }
    try { m = e.message || String(e); } catch (x) { m = "unreadable error"; }
    var s = (n ? n + ": " : "") + m;
    return s.length > 96 ? s.slice(0, 96) + "…" : s;
  }

  // ---- base64 helpers ---------------------------------------------------
  function b64encode(s) { return btoa(unescape(encodeURIComponent(s))); }
  function b64decode(s) { return decodeURIComponent(escape(atob(s))); }

  // ---- storage adapter --------------------------------------------------
  var store = {
    get: function (key) {
      try {
        if (hasStorage()) {
          return window.creationStorage.plain.getItem(key).then(function (raw) {
            return raw == null ? null : JSON.parse(b64decode(raw));
          });
        }
        var raw = localStorage.getItem(key);
        return Promise.resolve(raw == null ? null : JSON.parse(raw));
      } catch (e) { return Promise.resolve(null); }
    },
    set: function (key, value) {
      try {
        var json = JSON.stringify(value);
        if (hasStorage()) {
          return window.creationStorage.plain.setItem(key, b64encode(json));
        }
        localStorage.setItem(key, json);
      } catch (e) {}
      return Promise.resolve();
    }
  };

  // ---- dom --------------------------------------------------------------
  var appEl    = document.getElementById("app");
  var bodyEl   = document.getElementById("body");
  var statusEl = document.getElementById("status");
  var spinner  = document.getElementById("spinner");

  var renderToken = 0;
  var lastHtml = "<p>Ready.</p>";
  var shotUrl = null;          // the captured still, in memory for this session

  function render(html) {
    // A fact in the body replaces any photo that was on screen.
    shotUrl = null;
    if (appEl) appEl.classList.remove("shot-mode");
    var token = ++renderToken;
    lastHtml = html;
    bodyEl.classList.add("hidden");
    setTimeout(function () {
      if (token !== renderToken) return;
      bodyEl.innerHTML = html;
      bodyEl.classList.remove("hidden");
    }, 120);
  }
  function setStatus(t) { statusEl.textContent = t || ""; }
  function busy(on) { spinner.classList.toggle("on", !!on); }

  var statusTimer = null;
  function flashStatus(t) {
    setStatus(t);
    if (statusTimer) clearTimeout(statusTimer);
    statusTimer = setTimeout(function () {
      statusTimer = null;
      setStatus(count ? "fact " + count : "");
    }, 1200);
  }

  // ---- LLM call ---------------------------------------------------------
  var pending = null;

  function askLLM(prompt, opts) {
    opts = opts || {};
    return new Promise(function (resolve, reject) {
      if (!hasPlugin()) {
        return reject(new Error("no bridge"));
      }
      var timer = setTimeout(function () {
        pending = null; busy(false);
        reject(new Error("timeout"));
      }, opts.timeoutMs || 20000);

      pending = { resolve: resolve, reject: reject, timer: timer };

      try {
        window.PluginMessageHandler.postMessage(JSON.stringify({
          message: prompt,
          useLLM: true,
          wantsR1Response: !!opts.speak,
          wantsJournalEntry: !!opts.journal
        }));
      } catch (e) {
        clearTimeout(timer); pending = null; busy(false);
        reject(e);
      }
    });
  }

  window.onPluginMessage = function (data) {
    if (!data) return;

    // voice transcript (unverified channel — see §2.8)
    if (data.type === "sttEnded") {
      onTranscript(data.transcript || "");
      return;
    }

    if (!pending) return;
    var p = pending;
    pending = null;
    clearTimeout(p.timer);
    busy(false);

    var parsed = null;
    if (data.data) { try { parsed = JSON.parse(data.data); } catch (e) {} }
    p.resolve({ text: data.message || "", json: parsed });
  };

  // ---- app logic --------------------------------------------------------
  var count = 0;

  function fetchFact() {
    if (!hasPlugin()) {
      render("<p>Running outside the r1 — the assistant bridge is not available.</p>");
      return;
    }
    busy(true);
    setStatus("thinking…");
    askLLM(
      'Give one surprising, verifiable fact about owls, under 25 words. ' +
      'Reply ONLY with JSON: {"fact":"..."}',
      { speak: false }
    ).then(function (res) {
      var fact = (res.json && res.json.fact) || res.text || "No fact came back.";
      count += 1;
      render("<p>" + escapeHtml(fact) + "</p>");
      setStatus("fact " + count);
      store.set("state", { count: count, last: fact });
    }).catch(function (err) {
      setStatus("");
      render("<p>Could not reach the assistant. Tap to try again.</p>");
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function onTranscript(text) {
    if (!text) return;
    render("<p>" + escapeHtml(text) + "</p>");
  }

  // ---- orientation ------------------------------------------------------
  // The WebView is a fixed 240 x 282 portrait surface. To show the UI
  // upright while the device is held sideways, the app box is resized to the
  // swapped dimensions (282 x 240) and rotated about its own centre. A
  // 282 x 240 box rotated 90 degrees occupies exactly 240 x 282, so nothing
  // is clipped and no counter-scale is needed.
  var rotateOn = true;
  var currentDeg = 0;
  var applied = false;
  var calib = null;    // the pose treated as upright
  var LANDSCAPE_SIGN = 1;   // flip to -1 if landscape reads upside-down

  function applyOrientation(deg) {
    if (applied && deg === currentDeg) return;
    applied = true;
    currentDeg = deg;
    var landscape = (deg === 90 || deg === -90);
    appEl.style.width  = (landscape ? 282 : 240) + "px";
    appEl.style.height = (landscape ? 240 : 282) + "px";
    appEl.style.transform = "translate(-50%, -50%) rotate(" + deg + "deg)";
    if (landscape) appEl.classList.add("landscape");
    else appEl.classList.remove("landscape");
  }

  function orientationOf(u) {
    var ax = Math.abs(u.x);
    var ay = Math.abs(u.y);
    if (ax < 0.6 && ay < 0.6) return null;   // flat on a table, or mid-turn
    if (ay >= ax) return u.y < 0 ? 0 : 180;
    // Landscape: which sign means "readable" depends on whether +x points to
    // the screen's right or left, which the docs do not settle. If the
    // landscape view comes up upside-down relative to how you hold it, change
    // LANDSCAPE_SIGN to -1.
    return (u.x > 0 ? -90 : 90) * LANDSCAPE_SIGN;
  }

  function normaliseDeg(d) {
    var v = ((d % 360) + 360) % 360;
    return v === 180 ? 180 : (v === 90 ? 90 : (v === 270 ? -90 : 0));
  }

  // ---- calibration ------------------------------------------------------
  // The pose that counts as upright is measured, not assumed. A short burst of
  // samples is averaged so a single noisy reading cannot set it, and the same
  // routine runs at launch and when the on-screen "upright" button is tapped.
  // That is what makes opening the creation while already holding the r1
  // sideways work: the pose you are holding it in becomes upright.
  var CALIB_SAMPLES = 8;      // ~270 ms at 30 Hz
  var CALIB_TIMEOUT = 3000;   // give up if no usable reading arrives

  var calibBuf = null;        // array of unit vectors while measuring
  var calibTimer = null;
  var calibQuiet = false;     // true for the launch measurement: no status text

  function startCalib(quiet) {
    calibBuf = [];
    calibQuiet = !!quiet;
    candidate = 0;
    streak = 0;
    // If the sensor is not running yet, remember that a calibration is owed so
    // it runs the moment the sensor does start.
    calibPending = !accelState.started;
    calibPendingQuiet = !!quiet;
    if (calibTimer) clearTimeout(calibTimer);
    // Show upright straight away: the pose about to be measured is the one the
    // user is holding, so leaving the old rotation on screen during the ~270 ms
    // sample burst just looks like the tap was ignored.
    applyOrientation(0);
    if (!quiet) setStatus("hold still…");
    calibTimer = setTimeout(function () {
      calibTimer = null;
      if (calibBuf !== null) {
        calibBuf = null;
        if (!calibQuiet) flashStatus("no tilt reading");
      }
    }, CALIB_TIMEOUT);
  }

  function finishCalib(pose) {
    calibBuf = null;
    if (calibTimer) { clearTimeout(calibTimer); calibTimer = null; }
    calib = pose;
    dirPrimed = false;        // restart smoothing from the new pose
    candidate = 0;
    streak = 0;
    applyOrientation(0);
    if (!calibQuiet) flashStatus("upright set");
  }

  // ---- accelerometer (optional) ----------------------------------------
  function readAccel(d) {
    if (!d) return null;
    if (typeof d.tiltX === "number" || typeof d.tiltY === "number" || typeof d.tiltZ === "number") {
      return { x: d.tiltX || 0, y: d.tiltY || 0, z: d.tiltZ || 0, unit: "normalised" };
    }
    if (typeof d.x === "number" || typeof d.y === "number" || typeof d.z === "number") {
      return { x: d.x, y: d.y, z: d.z, unit: "normalised" };
    }
    if (typeof d.rawX === "number") {
      return { x: d.rawX / 9.81, y: d.rawY / 9.81, z: d.rawZ / 9.81, unit: "ms2" };
    }
    return null;
  }

  function num(v) { return (typeof v === "number" && isFinite(v)) ? v : 0; }

  // Direction only, so the result is the same whether the payload arrives
  // normalised (gravity ~ 1) or in m/s^2 (gravity ~ 9.81).
  function toUnit(a) {
    if (!a) return null;
    var x = num(a.x), y = num(a.y), z = num(a.z);
    var m = Math.sqrt(x * x + y * y + z * z);
    if (!(m > 0.05)) return null;
    return { x: x / m, y: y / m, z: z / m, m: m };
  }

  var SMOOTH = 0.18;          // low-pass on the direction vector
  var DWELL  = 5;             // samples a new orientation must hold (~170ms at 30Hz)
  var SHAKE_DEV = 0.8;        // 80% deviation from the running magnitude average
  var SHAKE_REVERSALS = 2;    // direction reversals within SHAKE_WINDOW that mean "shake"
  var SHAKE_WINDOW = 400;
  var SHAKE_COOLDOWN = 1000;  // ms between accepted shakes
  var SHAKE_SETTLE = 400;     // ms of tilt suppression after a shake

  var sx = 0, sy = 0, sz = 0, dirPrimed = false;
  var magAvg = 0, magPrimed = false;
  var px = 0, py = 0, pz = 0, prevPrimed = false;
  var reversals = [];
  var candidate = 0, streak = 0;
  var lastShake = 0;

  function clearScreen() {
    if (pending) {
      clearTimeout(pending.timer);
      pending = null;
    }
    busy(false);
    setStatus("");
    shotUrl = null;
    if (appEl) appEl.classList.remove("shot-mode");
    render("<p>Ready.</p>");
  }

  // Two independent ways to recognise a shake, because the payload may be a
  // normalised direction (constant magnitude, so deviation alone never fires)
  // or raw m/s^2 (where magnitude spikes hard):
  //   1. the magnitude jumps away from its running average, or
  //   2. the direction reverses sharply at least twice in a few hundred ms.
  // A reversal means the new vector points back against the old one, which a
  // deliberate turn cannot do — a turn goes from one pose to another once.
  function isShake(u, now) {
    var byMag = false;
    if (magPrimed) {
      byMag = Math.abs(u.m - magAvg) / Math.max(magAvg, 0.2) > SHAKE_DEV;
      magAvg += (u.m - magAvg) * 0.08;
    } else { magAvg = u.m; magPrimed = true; }

    var byReversal = false;
    if (prevPrimed) {
      var dot = u.x * px + u.y * py + u.z * pz;
      if (dot < -0.5) {
        reversals.push(now);
        while (reversals.length && now - reversals[0] > SHAKE_WINDOW) reversals.shift();
        byReversal = reversals.length >= SHAKE_REVERSALS;
      } else if (reversals.length && now - reversals[0] > SHAKE_WINDOW) {
        reversals.length = 0;
      }
    }
    px = u.x; py = u.y; pz = u.z; prevPrimed = true;

    if (!byMag && !byReversal) return false;
    if (now - lastShake <= SHAKE_COOLDOWN) return false;
    reversals.length = 0;
    return true;
  }

  function onAccel(d) {
    var u = toUnit(readAccel(d));
    if (!u) return;

    accelState.samples += 1;
    accelState.lastAt = Date.now();

    var now = Date.now();
    if (isShake(u, now)) {
      lastShake = now;
      clearScreen();
    }

    // --- calibration: average a short burst, then call that pose upright ---
    if (calibBuf !== null) {
      calibBuf.push(u);
      if (calibBuf.length >= CALIB_SAMPLES) {
        var ax = 0, ay = 0, az = 0;
        for (var i = 0; i < calibBuf.length; i++) {
          ax += calibBuf[i].x; ay += calibBuf[i].y; az += calibBuf[i].z;
        }
        var avg = toUnit({ x: ax, y: ay, z: az });
        var pose = avg ? orientationOf(avg) : null;
        if (pose === null) {
          calibBuf = [];      // flat on a table or mid-turn: keep sampling
        } else {
          finishCalib(pose);
        }
      }
      return;
    }

    // --- tilt: smoothed direction, committed on a threshold crossing ---
    if (!dirPrimed) { sx = u.x; sy = u.y; sz = u.z; dirPrimed = true; }
    else {
      sx += (u.x - sx) * SMOOTH;
      sy += (u.y - sy) * SMOOTH;
      sz += (u.z - sz) * SMOOTH;
    }

    if (!rotateOn) return;
    if (now - lastShake < SHAKE_SETTLE) return;

    var sm = Math.sqrt(sx * sx + sy * sy + sz * sz);
    if (!(sm > 0.05)) return;
    var raw = orientationOf({ x: sx / sm, y: sy / sm, z: sz / sm });
    if (raw === null) return;

    if (calib === null) return;

    var o = normaliseDeg(raw - calib);
    if (o === currentDeg) { streak = 0; return; }
    if (o === candidate) { streak += 1; }
    else { candidate = o; streak = 1; }
    if (streak >= DWELL) { streak = 0; applyOrientation(o); }
  }

  // ---- accelerometer start / stop --------------------------------------
  // The start path is the part that broke. Three things are different from a
  // one-shot boot attempt:
  //   * the sensor object is looked up again on every attempt, so a bridge
  //     injected after this script ran is still found;
  //   * a failed or refused attempt does not latch: the "already started" flag
  //     is only set once start() has actually returned, so a later tap retries;
  //   * a short backoff retries on its own, which covers a sensor that is not
  //     ready in the first few hundred milliseconds after launch.
  var accelState = {
    handle: null,
    started: false,
    starting: false,
    available: null,     // true / false / "unknown" / null (never asked)
    startError: null,
    samples: 0,
    lastAt: 0
  };

  var ACCEL_RETRY_DELAYS = [200, 400, 800, 1500, 2500, 4000];
  var ACCEL_RETRY_SLOW = 6000;   // after the burst, keep a slow watch going
  var accelRetryTimer = null;
  var accelRetryStep = 0;
  // Set when a calibration was asked for but the sensor was not running yet.
  // A sensor that only appears after the launch burst timed out would otherwise
  // start sampling with no reference pose, and tilt would stay inert until the
  // user tapped UPRIGHT a second time.
  var calibPending = false;
  var calibPendingQuiet = true;

  function clearAccelRetry() {
    if (accelRetryTimer) { clearTimeout(accelRetryTimer); accelRetryTimer = null; }
  }

  function scheduleAccelRetry() {
    if (accelState.started || accelRetryTimer) return;
    var d;
    if (accelRetryStep < ACCEL_RETRY_DELAYS.length) {
      d = ACCEL_RETRY_DELAYS[accelRetryStep];
      accelRetryStep += 1;
    } else {
      // The burst is spent, but a bridge that arrives late is exactly the
      // failure this is here to survive, so a slow watch keeps going rather
      // than latching "no sensor" for the rest of the session.
      d = ACCEL_RETRY_SLOW;
      if (!statusEl.textContent) setStatus("no tilt sensor");
    }
    accelRetryTimer = setTimeout(function () {
      accelRetryTimer = null;
      if (rotateOn) startAccel();
    }, d);
  }

  function startAccel() {
    if (accelState.started || accelState.starting) return;

    var a = accelObj();
    if (!a) {
      accelState.available = null;
      scheduleAccelRetry();
      return;
    }

    accelState.starting = true;

    // isAvailable() may return a promise, a plain boolean, or nothing at all.
    // Only a strict false is treated as "no sensor": an undefined answer is
    // not evidence of absence, and refusing to start on it is how a working
    // sensor ends up reported as missing.
    var avail;
    if (typeof a.isAvailable !== "function") {
      accelState.available = "unknown";
      avail = Promise.resolve("unknown");
    } else {
      try {
        avail = Promise.resolve(a.isAvailable());
      } catch (e) {
        accelState.available = false;
        accelState.startError = errText(e);
        accelState.starting = false;
        scheduleAccelRetry();
        return;
      }
    }

    avail.then(function (ok) {
      accelState.available = (ok === true) ? true : (ok === false ? false : "unknown");
      if (ok === false) {
        accelState.starting = false;
        scheduleAccelRetry();
        return;
      }
      try {
        a.start(onAccel, { frequency: 30 });
        accelState.handle = a;
        accelState.started = true;
        accelState.startError = null;
        accelRetryStep = 0;
        clearAccelRetry();
        // A calibration that was waiting on this start can run now.
        if (calibPending) {
          calibPending = false;
          if (calib === null && rotateOn && calibBuf === null) startCalib(calibPendingQuiet);
        }
      } catch (e) {
        accelState.started = false;
        accelState.startError = errText(e);
        scheduleAccelRetry();
      }
      accelState.starting = false;
    }).catch(function (e) {
      accelState.available = false;
      accelState.startError = errText(e);
      accelState.starting = false;
      scheduleAccelRetry();
    });
  }

  function stopAccel() {
    clearAccelRetry();
    if (accelState.handle) {
      try { accelState.handle.stop(); } catch (e) {}
      accelState.handle = null;
    }
    accelState.started = false;
    accelState.starting = false;
  }

  // ---- audio (optional) -------------------------------------------------
  // A short pitched ding on each scroll, synthesised with Web Audio so there
  // is no file and no network request. The whole layer is wrapped: if
  // AudioContext is missing or its construction throws, every call here is a
  // silent no-op and the rest of the page is unaffected.
  var audio = (function () {
    // Major pentatonic, two octaves. No interval in it sounds wrong at any
    // step, so climbing and descending both stay musical.
    var SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
    var BASE = 261.63;          // C4
    var PEAK = 0.25;            // gain at the top of the attack
    var FLOOR = 0.0001;         // never ramp to exactly 0: exponentialRamp throws
    var ATTACK = 0.01;
    var DECAY = 0.2;

    var ctx = null;
    var step = 0;
    var broken = false;

    function Ctor() {
      return window.AudioContext || window.webkitAudioContext || null;
    }

    // Created lazily, on the first user gesture, never at page load.
    function ensure() {
      if (broken) return null;
      if (ctx) return ctx;
      var C = Ctor();
      if (!C) { broken = true; return null; }
      try { ctx = new C(); } catch (e) { ctx = null; broken = true; return null; }
      return ctx;
    }

    function resume(c) {
      try {
        if (c.state === "suspended" && c.resume) {
          var p = c.resume();
          if (p && p.catch) p.catch(function () {});
        }
      } catch (e) {}
    }

    // Called from the side-button handler: Android blocks audio until a
    // gesture, and the OS may suspend the context later.
    function unlock() {
      var c = ensure();
      if (!c) return false;
      resume(c);
      return true;
    }

    function freq(i) {
      var idx = Math.max(0, Math.min(SCALE.length - 1, i));
      return BASE * Math.pow(2, SCALE[idx] / 12);
    }

    // dir is +1 for up, -1 for down. The step is clamped at both ends of the
    // scale rather than climbing forever.
    function ding(dir) {
      var c = ensure();
      if (!c) return false;
      try {
        resume(c);
        step = Math.max(0, Math.min(SCALE.length - 1, step + dir));
        var t = c.currentTime;
        var osc = c.createOscillator();
        var gain = c.createGain();
        osc.type = "triangle";   // cuts through the r1's small speaker
        osc.frequency.setValueAtTime(freq(step), t);
        gain.gain.setValueAtTime(FLOOR, t);
        gain.gain.linearRampToValueAtTime(PEAK, t + ATTACK);
        gain.gain.exponentialRampToValueAtTime(FLOOR, t + ATTACK + DECAY);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(t);
        osc.stop(t + ATTACK + DECAY + 0.02);
        osc.onended = function () {
          try { osc.disconnect(); gain.disconnect(); } catch (e) {}
        };
        return true;
      } catch (e) { return false; }
    }

    return {
      unlock: unlock,
      ding: ding,
      available: function () { return !broken && !!Ctor(); }
    };
  })();

  // ---- camera (optional) ------------------------------------------------
  // Camera access is an ordinary web API (getUserMedia), not a bridge call, and
  // it is confirmed working on the r1. Every step is still defensive: a missing
  // mediaDevices, a rejected promise and a throwing call all end in a readable
  // status line instead of an exception, and every track is stopped on close,
  // on pagehide, when the page is hidden, and on a facing switch that reopens
  // the device.
  var camEl      = document.getElementById("cam");
  var camVideo   = document.getElementById("camVideo");
  var camStatus  = document.getElementById("camStatus");
  var camBtn     = document.getElementById("camBtn");
  var camClose   = document.getElementById("camClose");
  var camSwitch  = document.getElementById("camSwitch");
  var camShotBtn = document.getElementById("camShot");

  var cam = { open: false, stream: null, facing: "environment", gen: 0, busy: false };

  function setCamStatus(t) { if (camStatus) camStatus.textContent = t || ""; }

  function camSupported() {
    return !!(navigator && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }

  function stopStream(s) {
    if (!s) return;
    var tracks = [];
    try { tracks = s.getTracks ? s.getTracks() : []; } catch (e) { tracks = []; }
    for (var i = 0; i < tracks.length; i++) {
      try { tracks[i].stop(); } catch (e) {}
    }
  }

  function requestStream(mode) {
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: false });
  }

  function playVideo() {
    try {
      var p = camVideo.play && camVideo.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  function videoTrack(stream) {
    try {
      var tracks = stream && stream.getVideoTracks ? stream.getVideoTracks() : [];
      return tracks && tracks.length ? tracks[0] : null;
    } catch (e) { return null; }
  }

  // Which physical camera a stream came from, so a device with one camera can
  // be told apart from a real switch.
  function deviceIdOf(stream) {
    try {
      var t = videoTrack(stream);
      var s = t && t.getSettings ? t.getSettings() : null;
      return (s && (s.deviceId || s.groupId)) || "";
    } catch (e) { return ""; }
  }

  function facingOf(stream) {
    try {
      var t = videoTrack(stream);
      var s = t && t.getSettings ? t.getSettings() : null;
      return (s && s.facingMode) || "";
    } catch (e) { return ""; }
  }

  // How many cameras the device admits to. -1 means "could not tell", which is
  // not the same as "one": an unreadable list must not block a real switch.
  function videoInputCount() {
    return new Promise(function (resolve) {
      try {
        if (!navigator || !navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
          return resolve(-1);
        }
        Promise.resolve(navigator.mediaDevices.enumerateDevices()).then(function (list) {
          var n = 0;
          for (var i = 0; i < (list ? list.length : 0); i++) {
            if (list[i] && list[i].kind === "videoinput") n += 1;
          }
          resolve(n);
        }).catch(function () { resolve(-1); });
      } catch (e) { resolve(-1); }
    });
  }

  function syncFacing() {
    if (!camSwitch) return;
    var front = cam.facing === "user";
    if (front) camSwitch.classList.add("front");
    else camSwitch.classList.remove("front");
    camSwitch.setAttribute("aria-pressed", front ? "true" : "false");
    camSwitch.setAttribute("aria-label", front ? "Switch to rear camera" : "Switch to front camera");
  }

  function stopCam() {
    cam.gen += 1;              // discard any stream still on its way
    cam.busy = false;
    if (cam.stream) { stopStream(cam.stream); cam.stream = null; }
    try {
      if (camVideo) {
        if (camVideo.pause) camVideo.pause();
        camVideo.srcObject = null;
      }
    } catch (e) {}
  }

  function camErrorText(err) {
    var name = (err && err.name) || "";
    if (name === "NotAllowedError" || name === "PermissionDeniedError") return "camera permission denied";
    if (name === "NotFoundError" || name === "DevicesNotFoundError") return "no camera found";
    if (name === "NotReadableError" || name === "TrackStartError") return "camera is busy";
    if (name === "SecurityError") return "camera blocked by the page";
    if (name === "OverconstrainedError") return "camera does not support this mode";
    return "camera unavailable";
  }

  function openCam() {
    if (cam.open) return;
    cam.open = true;
    cam.busy = false;
    if (camEl) camEl.classList.add("on");
    if (camBtn) camBtn.setAttribute("aria-pressed", "true");
    setCamStatus("starting camera…");

    if (!camSupported()) { setCamStatus("camera not available here"); return; }

    var gen = ++cam.gen;
    var req;
    try {
      req = requestStream(cam.facing);
    } catch (e) {
      setCamStatus(camErrorText(e));
      return;
    }

    Promise.resolve(req).then(function (stream) {
      if (gen !== cam.gen || !cam.open) { stopStream(stream); return; }   // closed while waiting
      cam.stream = stream;
      var f = facingOf(stream);
      if (f === "user" || f === "environment") cam.facing = f;
      try { camVideo.srcObject = stream; } catch (e) {}
      playVideo();
      syncFacing();
      setCamStatus("");
    }).catch(function (err) {
      if (gen !== cam.gen) return;
      setCamStatus(camErrorText(err));
    });
  }

  function closeCam() {
    var was = cam.open;
    cam.open = false;
    if (camEl) camEl.classList.remove("on");
    if (camBtn) camBtn.setAttribute("aria-pressed", "false");
    stopCam();
    setCamStatus("");
    return was;
  }

  // Ask the camera already in hand to move, instead of opening a second one.
  // Android refuses a second getUserMedia while a camera is held, which is
  // exactly the "camera is busy" the old request-first switch produced.
  // applyConstraints resolves without moving anything on some builds, so the
  // reported facing mode is checked before the move is believed.
  function tryApplyFacing(mode) {
    var t = videoTrack(cam.stream);
    if (!t || typeof t.applyConstraints !== "function") return Promise.resolve(false);
    var p;
    try {
      p = t.applyConstraints({ facingMode: { exact: mode } });
    } catch (e) {
      return Promise.resolve(false);
    }
    return Promise.resolve(p).then(function () {
      var s = null;
      try { s = t.getSettings ? t.getSettings() : null; } catch (e) { s = null; }
      if (s && s.facingMode) return s.facingMode === mode;
      return true;      // nothing reported: accept the resolve
    }).catch(function () { return false; });
  }

  // The fallback: release the device first, then ask for the other one. This is
  // the only path that reopens the camera, and it stops the old tracks before
  // the request goes out.
  function reopenFacing(next, prev, prevId, gen) {
    var old = cam.stream;
    cam.stream = null;
    try { if (camVideo) camVideo.srcObject = null; } catch (e) {}
    if (old) stopStream(old);

    var req;
    try {
      req = requestStream(next);
    } catch (e) {
      return restoreFacing(prev, gen, e, next);
    }

    return Promise.resolve(req).then(function (stream) {
      if (gen !== cam.gen || !cam.open) { stopStream(stream); cam.busy = false; return; }
      cam.busy = false;
      cam.stream = stream;
      var f = facingOf(stream);
      var nextId = deviceIdOf(stream);
      cam.facing = (f === "user" || f === "environment") ? f : next;
      try { camVideo.srcObject = stream; } catch (e) {}
      playVideo();
      syncFacing();
      if (prevId && nextId && prevId === nextId) setCamStatus("only one camera here");
      else setCamStatus("");
    }).catch(function (err) {
      if (gen !== cam.gen) return;
      return restoreFacing(prev, gen, err, next);
    });
  }

  // The switch failed and the old stream is already gone: put the previous
  // camera back so the preview is not left black, and say what went wrong.
  function restoreFacing(prev, gen, err, next) {
    var name = (err && err.name) || "";
    var msg;
    if (name === "OverconstrainedError" || name === "NotFoundError" || name === "DevicesNotFoundError") {
      msg = next === "user" ? "no front camera" : "no rear camera";
    } else {
      msg = camErrorText(err);
    }

    var req;
    try {
      req = requestStream(prev);
    } catch (e) {
      cam.busy = false;
      setCamStatus(msg);
      return;
    }

    return Promise.resolve(req).then(function (stream) {
      if (gen !== cam.gen || !cam.open) { stopStream(stream); cam.busy = false; return; }
      cam.busy = false;
      cam.stream = stream;
      try { camVideo.srcObject = stream; } catch (e) {}
      playVideo();
      setCamStatus(msg);
    }).catch(function () {
      cam.busy = false;
      setCamStatus(msg);
    });
  }

  function switchFacing() {
    if (!cam.open || cam.busy) return;
    if (!camSupported()) { setCamStatus("camera not available here"); return; }

    var next = cam.facing === "environment" ? "user" : "environment";
    var prev = cam.facing;
    var prevId = deviceIdOf(cam.stream);
    var gen = ++cam.gen;
    cam.busy = true;
    setCamStatus("switching…");

    videoInputCount().then(function (n) {
      if (gen !== cam.gen || !cam.open) { cam.busy = false; return; }
      if (n === 1) { cam.busy = false; setCamStatus("only one camera here"); return; }

      return tryApplyFacing(next).then(function (moved) {
        if (gen !== cam.gen || !cam.open) { cam.busy = false; return; }
        if (moved) {
          cam.busy = false;
          cam.facing = next;
          syncFacing();
          setCamStatus("");
          return;
        }
        return reopenFacing(next, prev, prevId, gen);
      });
    }).catch(function () {
      cam.busy = false;
      setCamStatus("camera unavailable");
    });
  }

  // Grab the current video frame as a JPEG data URL, close the camera, and put
  // the still where the fact text was. The data URL is held in a variable for
  // this session only: a full-size camera frame is far too big for the per
  //-creation storage quota, so nothing is written to creationStorage.
  function capture() {
    if (!cam.open) return;

    var w = 0, h = 0, ready = 0;
    try {
      w = camVideo.videoWidth || 0;
      h = camVideo.videoHeight || 0;
      ready = typeof camVideo.readyState === "number" ? camVideo.readyState : 0;
    } catch (e) {}

    if (!w || !h || ready < 2) { setCamStatus("no picture yet"); return; }

    var canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    var ctx = null;
    try { ctx = canvas.getContext("2d"); } catch (e) { ctx = null; }
    if (!ctx) { setCamStatus("capture not available here"); return; }

    try { ctx.drawImage(camVideo, 0, 0, w, h); } catch (e) { setCamStatus("capture failed"); return; }

    var url = "";
    try { url = canvas.toDataURL("image/jpeg", 0.72); } catch (e) { url = ""; }
    if (!url || url.indexOf("data:image") !== 0) { setCamStatus("capture failed"); return; }

    closeCam();
    showShot(url);
    flashStatus("photo taken");
  }

  function showShot(url) {
    shotUrl = url;
    var img = document.createElement("img");
    img.className = "shot fade";
    img.setAttribute("alt", "photo from the camera");
    img.setAttribute("role", "button");
    img.setAttribute("aria-label", "Dismiss photo");
    img.src = url;
    img.addEventListener("click", dismissShot);

    var token = ++renderToken;
    bodyEl.classList.add("hidden");
    if (appEl) appEl.classList.add("shot-mode");
    setTimeout(function () {
      if (token !== renderToken) return;
      bodyEl.innerHTML = "";
      bodyEl.appendChild(img);
      bodyEl.classList.remove("hidden");
    }, 120);
  }

  function dismissShot() {
    if (!shotUrl) return;
    shotUrl = null;
    if (appEl) appEl.classList.remove("shot-mode");
    render(lastHtml);
    flashStatus(count ? "fact " + count : "");
  }

  if (camBtn) camBtn.addEventListener("click", function () { openCam(); });
  if (camClose) camClose.addEventListener("click", function () { closeCam(); });
  if (camSwitch) camSwitch.addEventListener("click", function () { switchFacing(); });
  if (camShotBtn) camShotBtn.addEventListener("click", function () { capture(); });

  // ---- on-screen orientation controls ----------------------------------
  // The r1's own control scheme claims a triple click for its recorder, so the
  // third side-button tap never reaches the page and a triple-tap gesture is
  // unreachable on the device. These two buttons do the same job from the
  // touchscreen, where nothing intercepts them.
  var recalBtn = document.getElementById("recalBtn");
  var tiltBtn  = document.getElementById("tiltBtn");

  function syncTilt() {
    if (!tiltBtn) return;
    if (rotateOn) {
      tiltBtn.classList.remove("off");
      tiltBtn.setAttribute("aria-pressed", "true");
      tiltBtn.setAttribute("aria-label", "Turn tilt off");
    } else {
      tiltBtn.classList.add("off");
      tiltBtn.setAttribute("aria-pressed", "false");
      tiltBtn.setAttribute("aria-label", "Turn tilt on");
    }
  }

  function recalibrate() {
    rotateOn = true;
    syncTilt();
    store.set("prefs", { tilt: true });
    accelRetryStep = 0;
    clearAccelRetry();
    if (!hasSensors()) {
      // Not a verdict: the bridge may still be on its way in. Keep trying, and
      // say so plainly rather than claiming the hardware is absent.
      flashStatus("no tilt sensor");
      calibPending = true;
      calibPendingQuiet = false;
      scheduleAccelRetry();
      return;
    }
    startAccel();
    startCalib(false);
  }

  function toggleTilt() {
    if (!hasSensors() && rotateOn) {
      flashStatus("no tilt sensor");
      calibPending = true;
      calibPendingQuiet = false;
      scheduleAccelRetry();
      return;
    }
    rotateOn = !rotateOn;
    syncTilt();
    store.set("prefs", { tilt: rotateOn });

    if (!rotateOn) {
      calibBuf = null;
      if (calibTimer) { clearTimeout(calibTimer); calibTimer = null; }
      candidate = 0;
      streak = 0;
      applyOrientation(0);
      flashStatus("tilt off");
      return;
    }

    accelRetryStep = 0;
    clearAccelRetry();
    startAccel();
    if (calib === null) startCalib(false);
    else { applyOrientation(0); flashStatus("tilt on"); }
  }

  if (recalBtn) recalBtn.addEventListener("click", function () { recalibrate(); });
  if (tiltBtn) tiltBtn.addEventListener("click", function () { toggleTilt(); });

  // ---- diagnostics ------------------------------------------------------
  // The r1 cannot be inspected from outside, so the creation reports on itself.
  // Every value here is read live at the moment the panel is drawn, and the
  // panel redraws while it is open so the sample counter is a live reading.
  var diagEl    = document.getElementById("diag");
  var diagList  = document.getElementById("diagList");
  var diagBtn   = document.getElementById("diagBtn");
  var diagClose = document.getElementById("diagClose");
  var diagOpen  = false;
  var diagTimer = null;

  function yn(v) { return v ? "yes" : "no"; }

  function availText() {
    var a = accelState.available;
    if (a === true) return "true";
    if (a === false) return "false";
    if (a === "unknown") return "unknown";
    return "not asked";
  }
  function availClass() {
    var a = accelState.available;
    if (a === true) return "ok";
    if (a === false) return "no";
    return "warn";
  }
  function startText() {
    if (accelState.started) return "ok";
    if (accelState.starting) return "…";
    if (accelState.startError) return "threw";
    return "not started";
  }
  function startClass() {
    if (accelState.started) return "ok";
    if (accelState.startError) return "no";
    return "warn";
  }

  function mkRow(name, val, cls, sub) {
    var r = document.createElement("div");
    r.className = sub ? "drow sub" : "drow";
    var n = document.createElement("span");
    n.className = "dname";
    n.textContent = name;
    var v = document.createElement("span");
    v.className = "dval" + (cls ? " " + cls : "");
    v.textContent = val;
    r.appendChild(n); r.appendChild(v);
    return r;
  }

  function mkErr(text) {
    var d = document.createElement("div");
    d.className = "derr";
    d.setAttribute("title", text);
    d.textContent = text;
    return d;
  }

  function renderDiag() {
    if (!diagList) return;
    while (diagList.firstChild) diagList.removeChild(diagList.firstChild);

    var pmh = safeGet("PluginMessageHandler");
    var sto = safeGet("creationStorage");
    var sen = safeGet("creationSensors");
    var voc = safeGet("CreationVoiceHandler");
    var cls = safeGet("closeWebView");
    var acc = accelObj();
    var plain = false;
    try { plain = !!(sto && sto.plain); } catch (e) { plain = false; }

    diagList.appendChild(mkRow("PluginMessageHandler", yn(pmh), pmh ? "ok" : "no"));
    diagList.appendChild(mkRow("creationStorage", yn(sto), sto ? "ok" : "no"));
    diagList.appendChild(mkRow(".plain", yn(plain), plain ? "ok" : "no", true));
    diagList.appendChild(mkRow("creationSensors", yn(sen), sen ? "ok" : "no"));
    diagList.appendChild(mkRow("accelerometer", yn(acc), acc ? "ok" : "no", true));
    diagList.appendChild(mkRow("isAvailable()", availText(), availClass(), true));
    diagList.appendChild(mkRow("start()", startText(), startClass(), true));
    if (accelState.startError) diagList.appendChild(mkErr(accelState.startError));
    diagList.appendChild(mkRow("samples", String(accelState.samples), accelState.samples > 0 ? "ok" : "warn", true));
    diagList.appendChild(mkRow("CreationVoiceHandler", yn(voc), voc ? "ok" : "no"));
    diagList.appendChild(mkRow("closeWebView", yn(cls), cls ? "ok" : "no"));
  }

  // Ask the sensor object directly, so the panel shows a fresh answer rather
  // than whatever the last start attempt happened to record.
  function refreshAvail() {
    var a = accelObj();
    if (!a) { accelState.available = null; return Promise.resolve(); }
    if (typeof a.isAvailable !== "function") {
      accelState.available = "unknown";
      return Promise.resolve();
    }
    var r;
    try {
      r = a.isAvailable();
    } catch (e) {
      accelState.available = false;
      accelState.startError = errText(e);
      return Promise.resolve();
    }
    return Promise.resolve(r).then(function (ok) {
      accelState.available = (ok === true) ? true : (ok === false ? false : "unknown");
    }).catch(function (e) {
      accelState.available = false;
      accelState.startError = errText(e);
    });
  }

  function openDiag() {
    diagOpen = true;
    if (diagEl) diagEl.classList.add("on");
    if (diagBtn) diagBtn.setAttribute("aria-pressed", "true");
    renderDiag();
    if (rotateOn) startAccel();
    refreshAvail().then(renderDiag);
    if (diagTimer) clearInterval(diagTimer);
    diagTimer = setInterval(function () {
      if (!diagOpen) return;
      renderDiag();
    }, 700);
  }

  function closeDiag() {
    diagOpen = false;
    if (diagEl) diagEl.classList.remove("on");
    if (diagBtn) diagBtn.setAttribute("aria-pressed", "false");
    if (diagTimer) { clearInterval(diagTimer); diagTimer = null; }
  }

  if (diagBtn) diagBtn.addEventListener("click", function () {
    if (diagOpen) closeDiag(); else openDiag();
  });
  if (diagClose) diagClose.addEventListener("click", function () { closeDiag(); });
  if (diagList) diagList.addEventListener("click", function () {
    refreshAvail().then(renderDiag);
  });

  // ---- input ------------------------------------------------------------
  // One tap: a fact. Two taps: close the camera, or the creation. A third tap
  // is swallowed by the r1's recorder shortcut, so calibration lives on the
  // "upright" button instead.
  var tapCount = 0;
  var tapTimer = null;

  window.addEventListener("sideClick", function () {
    audio.unlock();   // first gesture unlocks audio; later ones resume it
    tapCount += 1;
    if (tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(function () {
      var n = tapCount;
      tapCount = 0;
      tapTimer = null;
      if (n === 1) onSingleTap();
      else onDoubleTap();
    }, 350);
  });

  function onSingleTap() { fetchFact(); }

  function onDoubleTap() {
    if (cam.open) { closeCam(); return; }
    if (hasClose()) {
      try { window.closeWebView.postMessage(""); } catch (e) {}
    } else {
      setStatus("close is r1-only");
    }
  }

  window.addEventListener("longPressStart", function () {
    if (hasVoice()) {
      try { window.CreationVoiceHandler.postMessage("start"); } catch (e) {}
      setStatus("listening…");
    } else {
      setStatus("voice is r1-only");
    }
  });

  window.addEventListener("longPressEnd", function () {
    if (hasVoice()) {
      try { window.CreationVoiceHandler.postMessage("stop"); } catch (e) {}
    }
    setStatus("");
  });

  // Scroll wheel: a ding that climbs the scale going up and descends going
  // down, plus the existing direction readout.
  window.addEventListener("scrollUp", function () {
    var ok = audio.ding(1);
    setStatus(ok ? "▲" : "▲ no audio");
  });
  window.addEventListener("scrollDown", function () {
    var ok = audio.ding(-1);
    setStatus(ok ? "▼" : "▼ no audio");
  });

  // ---- teardown ---------------------------------------------------------
  // The camera light must not stay on: stop the sensor and every media track
  // when the page goes away or is backgrounded.
  window.addEventListener("pagehide", function () {
    stopAccel();
    closeCam();
    closeDiag();
    if (calibTimer) { clearTimeout(calibTimer); calibTimer = null; }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      closeCam();
      stopAccel();
    } else if (rotateOn) {
      startAccel();
    }
  });

  // ---- boot -------------------------------------------------------------
  store.get("state").then(function (s) {
    if (s && s.count) {
      count = s.count;
      setStatus("fact " + count);
    }
  }).catch(function () {});

  store.get("prefs").then(function (p) {
    if (p && (p.tilt === false || p.rotate === false)) rotateOn = false;
  }).catch(function () {}).then(function () {
    syncTilt();
    syncFacing();
    applyOrientation(0);
    if (rotateOn) {
      startAccel();
      startCalib(true);
    }
  });
})();
</script>
</body>
</html>
