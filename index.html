<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, height=282, initial-scale=1, user-scalable=no">
<title>Owl Facts</title>
<style>
  :root { --bg:#101014; --fg:#f4f1ea; --dim:#8b8b96; --accent:#ffb347; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 240px; height: 282px; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: relative; width: 100%; height: 100%; padding: 14px; display: flex; flex-direction: column; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  #hint { font-size: 10px; color: var(--dim); margin-top: 2px; }
  #body { flex: 1; margin-top: 10px; font-size: 12px; line-height: 1.45; overflow: hidden; }
  #body ul { padding-left: 14px; }
  #body li { margin-bottom: 6px; }
  #status { font-size: 10px; color: var(--dim); height: 12px; }
  .fade { transition: opacity 180ms ease-out, transform 180ms ease-out; }
  .hidden { opacity: 0; transform: translateY(6px); pointer-events: none; }
  #spinner {
    position: absolute; right: 14px; top: 14px; width: 10px; height: 10px;
    border: 2px solid var(--dim); border-top-color: var(--accent); border-radius: 50%;
    opacity: 0; transition: opacity 150ms ease-out;
  }
  #spinner.on { opacity: 1; animation: spin 700ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <h1>Owl Facts</h1>
  <div id="hint">Tap the side button for a fact</div>
  <div id="spinner"></div>
  <div id="body" class="fade"><p>Ready.</p></div>
  <div id="status"></div>
</div>

<script>
(function () {
  "use strict";

  // ---- bridge detection -------------------------------------------------
  var bridge = {
    hasPlugin:  typeof window.PluginMessageHandler !== "undefined",
    hasStorage: !!(window.creationStorage && window.creationStorage.plain),
    hasSensors: !!(window.creationSensors && window.creationSensors.accelerometer),
    hasClose:   typeof window.closeWebView !== "undefined",
    hasVoice:   typeof window.CreationVoiceHandler !== "undefined"
  };

  // ---- base64 helpers ---------------------------------------------------
  function b64encode(s) { return btoa(unescape(encodeURIComponent(s))); }
  function b64decode(s) { return decodeURIComponent(escape(atob(s))); }

  // ---- storage adapter --------------------------------------------------
  var store = {
    get: function (key) {
      try {
        if (bridge.hasStorage) {
          return window.creationStorage.plain.getItem(key).then(function (raw) {
            return raw == null ? null : JSON.parse(b64decode(raw));
          });
        }
        var raw = localStorage.getItem(key);
        return Promise.resolve(raw == null ? null : JSON.parse(raw));
      } catch (e) { return Promise.resolve(null); }
    },
    set: function (key, value) {
      try {
        var json = JSON.stringify(value);
        if (bridge.hasStorage) {
          return window.creationStorage.plain.setItem(key, b64encode(json));
        }
        localStorage.setItem(key, json);
      } catch (e) {}
      return Promise.resolve();
    }
  };

  // ---- dom --------------------------------------------------------------
  var bodyEl   = document.getElementById("body");
  var statusEl = document.getElementById("status");
  var spinner  = document.getElementById("spinner");

  function render(html) {
    bodyEl.classList.add("hidden");
    setTimeout(function () {
      bodyEl.innerHTML = html;
      bodyEl.classList.remove("hidden");
    }, 120);
  }
  function setStatus(t) { statusEl.textContent = t || ""; }
  function busy(on) { spinner.classList.toggle("on", !!on); }

  // ---- LLM call ---------------------------------------------------------
  var pending = null;

  function askLLM(prompt, opts) {
    opts = opts || {};
    return new Promise(function (resolve, reject) {
      if (!bridge.hasPlugin) {
        return reject(new Error("no bridge"));
      }
      var timer = setTimeout(function () {
        pending = null; busy(false);
        reject(new Error("timeout"));
      }, opts.timeoutMs || 20000);

      pending = { resolve: resolve, reject: reject, timer: timer };

      try {
        window.PluginMessageHandler.postMessage(JSON.stringify({
          message: prompt,
          useLLM: true,
          wantsR1Response: !!opts.speak,
          wantsJournalEntry: !!opts.journal
        }));
      } catch (e) {
        clearTimeout(timer); pending = null; busy(false);
        reject(e);
      }
    });
  }

  window.onPluginMessage = function (data) {
    if (!data) return;

    // voice transcript (unverified channel — see §2.8)
    if (data.type === "sttEnded") {
      onTranscript(data.transcript || "");
      return;
    }

    if (!pending) return;
    var p = pending;
    pending = null;
    clearTimeout(p.timer);
    busy(false);

    var parsed = null;
    if (data.data) { try { parsed = JSON.parse(data.data); } catch (e) {} }
    p.resolve({ text: data.message || "", json: parsed });
  };

  // ---- app logic --------------------------------------------------------
  var count = 0;

  function fetchFact() {
    if (!bridge.hasPlugin) {
      render("<p>Running outside the r1 — the assistant bridge is not available.</p>");
      return;
    }
    busy(true);
    setStatus("thinking…");
    askLLM(
      'Give one surprising, verifiable fact about owls, under 25 words. ' +
      'Reply ONLY with JSON: {"fact":"..."}',
      { speak: false }
    ).then(function (res) {
      var fact = (res.json && res.json.fact) || res.text || "No fact came back.";
      count += 1;
      render("<p>" + escapeHtml(fact) + "</p>");
      setStatus("fact " + count);
      store.set("state", { count: count, last: fact });
    }).catch(function (err) {
      setStatus("");
      render("<p>Could not reach the assistant. Tap to try again.</p>");
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function onTranscript(text) {
    if (!text) return;
    render("<p>" + escapeHtml(text) + "</p>");
  }

  // ---- input ------------------------------------------------------------
  var lastClick = 0;

  window.addEventListener("sideClick", function () {
    var now = Date.now();
    if (now - lastClick < 300) {
      lastClick = 0;
      onDoubleTap();
      return;
    }
    lastClick = now;
    setTimeout(function () {
      if (lastClick === now) { lastClick = 0; onSingleTap(); }
    }, 300);
  });

  function onSingleTap() { fetchFact(); }

  function onDoubleTap() {
    if (bridge.hasClose) {
      try { window.closeWebView.postMessage(""); } catch (e) {}
    } else {
      setStatus("close is r1-only");
    }
  }

  window.addEventListener("longPressStart", function () {
    if (bridge.hasVoice) {
      try { window.CreationVoiceHandler.postMessage("start"); } catch (e) {}
      setStatus("listening…");
    } else {
      setStatus("voice is r1-only");
    }
  });

  window.addEventListener("longPressEnd", function () {
    if (bridge.hasVoice) {
      try { window.CreationVoiceHandler.postMessage("stop"); } catch (e) {}
    }
    setStatus("");
  });

  window.addEventListener("scrollUp",   function () { setStatus("▲"); });
  window.addEventListener("scrollDown", function () { setStatus("▼"); });

  // ---- accelerometer (optional) ----------------------------------------
  function readAccel(d) {
    if (!d) return null;
    if (typeof d.tiltX === "number" || typeof d.tiltY === "number" || typeof d.tiltZ === "number") {
      return { x: d.tiltX || 0, y: d.tiltY || 0, z: d.tiltZ || 0, unit: "normalised" };
    }
    if (typeof d.x === "number" || typeof d.y === "number" || typeof d.z === "number") {
      return { x: d.x, y: d.y, z: d.z, unit: "normalised" };
    }
    if (typeof d.rawX === "number") {
      return { x: d.rawX / 9.81, y: d.rawY / 9.81, z: d.rawZ / 9.81, unit: "ms2" };
    }
    return null;
  }

  var accelHandle = null;
  function startAccel() {
    if (!bridge.hasSensors) return;
    var accel = window.creationSensors.accelerometer;
    Promise.resolve(accel.isAvailable()).then(function (ok) {
      if (!ok) return;
      accelHandle = accel;
      accel.start(function (d) {
        var a = readAccel(d);
        if (a && a.z < -0.6) setStatus("face down");
      }, { frequency: 30 });
    }).catch(function () {});
  }
  function stopAccel() {
    if (accelHandle) { try { accelHandle.stop(); } catch (e) {} accelHandle = null; }
  }
  window.addEventListener("pagehide", stopAccel);

  // ---- boot -------------------------------------------------------------
  store.get("state").then(function (s) {
    if (s && s.count) {
      count = s.count;
      setStatus("fact " + count);
    }
  });
  startAccel();
})();
</script>
</body>
</html>
